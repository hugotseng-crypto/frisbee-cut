<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>切传 CUT</title>
<style>
  :root { --ink:#102418; --grass:#1f7a3a; --end:#165c2c; --line:rgba(255,255,255,.85); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { height:100%; background:#0b1a10; color:#f4fff6; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; overflow:hidden; }
  #hud { position:fixed; inset:0 0 auto 0; z-index:3; padding:calc(10px + env(safe-area-inset-top)) 14px 0; display:flex; justify-content:space-between; pointer-events:none; }
  .stat { font-weight:800; letter-spacing:.04em; }
  .stat small { display:block; font-size:11px; opacity:.7; font-weight:600; }
  #stall { font-variant-numeric:tabular-nums; font-size:28px; }
  #stall.warn { color:#ffd60a; } #stall.hot { color:#ff453a; }
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:4; padding:8px 10px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.55)); }
  .row { display:flex; gap:8px; }
  button { border:0; border-radius:12px; padding:11px 10px; font-weight:800; font-size:14px; font-family:inherit; }
  .throw { flex:1; background:#16331f; color:#e9ffe9; }
  .throw.on { background:#34c759; color:#06210d; }
  .act { flex:1; background:#0e2a44; color:#d6efff; }
  #overlay { position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; background:rgba(6,16,10,.72); backdrop-filter:blur(8px); padding:24px; }
  #overlay.hide { display:none; }
  .card { width:min(420px,100%); background:#102418; border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:22px 18px; text-align:center; }
  h1 { font-size:34px; letter-spacing:.12em; }
  p { margin:10px 0 16px; line-height:1.55; color:#cfe8d4; font-size:14px; }
  .go { width:100%; background:#34c759; color:#06210d; font-size:16px; padding:14px; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
</style>
</head>
<body>
<div id="hud">
  <div class="stat">得分 <span id="score">0</span><small>连续 <span id="combo">0</span></small></div>
  <div class="stat" style="text-align:center">STALL<div id="stall">0</div></div>
  <div class="stat" style="text-align:right">掉盘 <span id="turn">0</span>/3<small>最佳 <span id="best">0</span></small></div>
</div>
<div id="bar">
  <div class="row" style="margin-bottom:8px">
    <button class="throw on" id="tFlat">平传</button>
    <button class="throw" id="tOut">外侧弯</button>
    <button class="throw" id="tHam">锤子</button>
  </div>
  <div class="row">
    <button class="act" id="cutUnder">切边 Under</button>
    <button class="act" id="cutDeep">切深 Deep</button>
  </div>
</div>
<div id="overlay">
  <div class="card">
    <h1>CUT</h1>
    <p>从持盘人拖出弧线传球。切边近、切深远。分区里接住得分，掉盘三次结束。<br>Stall 数到 10 也会掉盘。</p>
    <button class="go" id="startBtn">开打</button>
  </div>
</div>
<canvas id="c"></canvas>
<script src="game.js"></script>
</body>
</html>
